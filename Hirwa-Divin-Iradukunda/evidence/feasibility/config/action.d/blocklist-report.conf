# Runs the blocklist hook each time the jail bans or unbans an address.
# fail2ban substitutes <ip> with the banned address and <name> with the jail name.
[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /opt/blocklist/hook.py ban <ip> <name>
actionunban = /opt/blocklist/hook.py unban <ip> <name>

[Init]
